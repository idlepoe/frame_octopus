name: frame_octopus
description: 'A friendly, offline Windows video contact-sheet studio.'
publish_to: none
version: 1.0.0+3
environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffmpeg_kit_flutter_new_full: 2.5.8
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: 1.0.11
  file_picker: 10.3.10
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  path: ^1.9.1
  desktop_drop: ^0.8.4
  window_manager: ^0.5.2
  fluent_ui: 4.13.0
  video_player: ^2.11.1
  share_plus: 12.0.1
  wakelock_plus: ^1.5.2
  firebase_core: ^5.1.0
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.16.12
flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
    - assets/icon/

# Store identity reserved in Partner Center on 2026-11-22. No signing key is stored here.
msix_config:
  display_name: Frame Octopus
  publisher_display_name: 이제영
  identity_name: 8C13C29F.FrameOctopus
  publisher: CN=E6E0CA64-5693-4B23-9A95-DF94678405F8
  msix_version: 1.0.0.0
  logo_path: assets/icon/mosaic_octopus.png
  architecture: x64
  store: true
  sign_msix: false
  install_certificate: false
  output_path: build/distribution
  output_name: Frame-Octopus-1.0.0-Windows-x64-store
  capabilities: ''
  languages: en-us, ko-kr, ja-jp
