name: frame_octopus
description: 'A friendly, offline Windows video contact-sheet studio.'
publish_to: none
version: 0.2.0+2
environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffmpeg_kit_flutter_new_full: 2.5.8
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  file_picker: 10.3.10
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  path: ^1.9.1
  desktop_drop: ^0.8.4
  window_manager: ^0.5.2
  fluent_ui: 4.13.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.16.12
flutter:
  uses-material-design: true
  assets:
    - assets/mascot/
    - assets/icon/

# Development identity only. Replace all three identity fields from Partner Center for Store submission.
msix_config:
  display_name: Frame Octopus
  publisher_display_name: Frame Octopus Development
  identity_name: ink.idlepoe.FrameOctopus.Development
  publisher: CN=FrameOctopus.Development
  msix_version: 0.2.0.0
  logo_path: assets/icon/mosaic_octopus.png
  architecture: x64
  store: false
  sign_msix: false
  install_certificate: false
  output_path: build/distribution
  output_name: Frame-Octopus-0.2.0-Windows-x64-unsigned-dev
  capabilities: ''
  languages: en-us, ko-kr, ja-jp
